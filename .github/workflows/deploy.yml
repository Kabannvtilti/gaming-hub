name: Lab 12 CI/CD

on:
  push:
    branches: [feat/lab12-performance]

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Tailwind and verify committed CSS
        run: |
          pnpm run build
          git diff --exit-code -- css/tailwind.css
      - name: Run automated tests
        run: pnpm test
      - name: Deploy to the separate Lab 12 Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.LAB12_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.LAB12_VERCEL_PROJECT_ID }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::warning::Direct deployment skipped: configure the Lab 12 Vercel token and project variables."
            echo "Direct Vercel deployment was skipped because its configuration is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npx --yes vercel@66.6.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@66.6.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@66.6.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
